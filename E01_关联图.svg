<svg viewBox="0 0 960 980" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a0aec0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="980" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">第 1～7 讲关联图</text>

  <!-- Main chain boxes -->
  <!-- 01 叙事 -->
  <rect x="220" y="70" width="340" height="86" rx="12" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="390" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#1a365d">01 叙事</text>
  <text x="390" y="122" text-anchor="middle" font-size="13" fill="#2c5282">宇宙第一性原理：</text>
  <text x="390" y="141" text-anchor="middle" font-size="13" fill="#2c5282">世界通过叙事被理解和驱动</text>

  <!-- 02 重尾 -->
  <rect x="220" y="196" width="340" height="86" rx="12" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="390" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#1a365d">02 重尾</text>
  <text x="390" y="248" text-anchor="middle" font-size="13" fill="#2c5282">叙事之下的世界真相：</text>
  <text x="390" y="267" text-anchor="middle" font-size="13" fill="#2c5282">不均匀、服从极端值/复利</text>

  <!-- 03 能动 -->
  <rect x="220" y="322" width="340" height="86" rx="12" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="390" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#1a365d">03 能动</text>
  <text x="390" y="374" text-anchor="middle" font-size="13" fill="#2c5282">为何多数人看不清 02：</text>
  <text x="390" y="393" text-anchor="middle" font-size="13" fill="#2c5282">旧叙事(稳态生存逻辑)困住了人</text>

  <!-- 04 约束 -->
  <rect x="220" y="448" width="340" height="86" rx="12" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="390" y="476" text-anchor="middle" font-size="17" font-weight="700" fill="#1a365d">04 约束</text>
  <text x="390" y="500" text-anchor="middle" font-size="13" fill="#2c5282">破除旧叙事后，新叙事</text>
  <text x="390" y="519" text-anchor="middle" font-size="13" fill="#2c5282">仍须尊重硬约束，不能变成许愿</text>

  <!-- 06 可能 -->
  <rect x="220" y="574" width="340" height="86" rx="12" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="390" y="602" text-anchor="middle" font-size="17" font-weight="700" fill="#1a365d">06 可能</text>
  <text x="390" y="626" text-anchor="middle" font-size="13" fill="#2c5282">约束之内依然存在的</text>
  <text x="390" y="645" text-anchor="middle" font-size="13" fill="#2c5282">不确定性，是叙事与意义的燃料</text>

  <!-- 07 内核 -->
  <rect x="200" y="700" width="380" height="104" rx="12" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="390" y="728" text-anchor="middle" font-size="17" font-weight="700" fill="#744210">07 内核</text>
  <text x="390" y="752" text-anchor="middle" font-size="13" fill="#744210">谁在写叙事、谁在承受重尾/约束/不确定：</text>
  <text x="390" y="771" text-anchor="middle" font-size="13" fill="#744210">三层自我，成长 = 改写内核参数</text>

  <!-- 05 问答 (side box) -->
  <rect x="650" y="196" width="270" height="212" rx="12" fill="#f0fff4" stroke="#38a169" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="785" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#22543d">05 问答</text>
  <text x="785" y="252" text-anchor="middle" font-size="13" fill="#276749">对 01～04 的答疑</text>
  <text x="785" y="272" text-anchor="middle" font-size="13" fill="#276749">与个案应用</text>
  <text x="785" y="300" text-anchor="middle" font-size="12" fill="#2f855a">· 个人赛道选择</text>
  <text x="785" y="320" text-anchor="middle" font-size="12" fill="#2f855a">· 教育中的能动边界</text>
  <text x="785" y="340" text-anchor="middle" font-size="12" fill="#2f855a">· AI 与人的经历之别</text>

  <!-- Main vertical arrows -->
  <line x1="390" y1="156" x2="390" y2="194" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="390" y1="282" x2="390" y2="320" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="390" y1="408" x2="390" y2="446" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="390" y1="534" x2="390" y2="572" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="390" y1="660" x2="390" y2="698" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <text x="565" y="180" text-anchor="middle" font-size="11.5" fill="#4a5568">叙事需要设定目标函数才能揭示</text>
  <text x="575" y="306" text-anchor="middle" font-size="11.5" fill="#4a5568">看清重尾却仍困于旧观念，为什么？</text>
  <text x="565" y="432" text-anchor="middle" font-size="11.5" fill="#4a5568">跳出旧叙事后，新行动仍要过硬约束关</text>
  <text x="565" y="558" text-anchor="middle" font-size="11.5" fill="#4a5568">约束之内、规律之外仍有不可消除的不确定性</text>
  <text x="565" y="684" text-anchor="middle" font-size="11.5" fill="#4a5568">不确定驱动的一切选择，最终由谁承接？</text>

  <!-- dashed connections from 05 to 01-04 -->
  <line x1="648" y1="239" x2="562" y2="113" stroke="#68d391" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrowDash)"/>
  <line x1="648" y1="270" x2="562" y2="239" stroke="#68d391" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrowDash)"/>
  <line x1="648" y1="310" x2="562" y2="365" stroke="#68d391" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrowDash)"/>
  <line x1="648" y1="350" x2="562" y2="491" stroke="#68d391" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrowDash)"/>

  <!-- loop back arrow: 07 -> 01, curve around the left -->
  <path d="M 200 752 C 40 752, 40 100, 218 100" fill="none" stroke="#d69e2e" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrowDash)"/>
  <text x="70" y="430" text-anchor="middle" font-size="12" fill="#b7791f" transform="rotate(-90 70 430)">内核自我的更新，回头定义你会讲出怎样的叙事</text>

  <!-- Legend -->
  <rect x="220" y="880" width="18" height="18" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="246" y="894" font-size="12.5" fill="#2d3748">世界观主链（01→02→03→04→06）</text>
  <rect x="220" y="908" width="18" height="18" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="246" y="922" font-size="12.5" fill="#2d3748">07 内核：承接一切并回写整个叙事循环</text>
  <rect x="220" y="936" width="18" height="18" fill="#f0fff4" stroke="#38a169" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="246" y="950" font-size="12.5" fill="#2d3748">05 问答：对主链的补充说明（非独立环节）</text>
</svg>
